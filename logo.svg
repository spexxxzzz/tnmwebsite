<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  
  <!-- Background pill -->
  <rect x="0" y="4" width="100" height="32" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  
    <!-- T -->
  <text x="12" y="28" font-family="ui-monospace, 'SF Mono', monospace" font-size="18" font-weight="600" fill="#fafafa">T</text>
    
  <!-- ∧ (Lambda/Wedge) -->
  <text x="32" y="28" font-family="ui-monospace, 'SF Mono', monospace" font-size="18" font-weight="600" fill="url(#logo-gradient)">∧</text>
    
    <!-- M -->
  <text x="55" y="28" font-family="ui-monospace, 'SF Mono', monospace" font-size="18" font-weight="600" fill="#fafafa">M</text>
    
  <!-- C (optional) -->
  <text x="78" y="28" font-family="ui-monospace, 'SF Mono', monospace" font-size="18" font-weight="600" fill="#71717a">C</text>
</svg>
